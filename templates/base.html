<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Dashboard{% endblock %} · {{ business_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% if not is_logged_in %}auth-body{% endif %}">

{% if is_logged_in %}
<div class="app-shell">

    <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="sidebar-brand-mark">{{ business_name[:1] }}</span>
            <span class="sidebar-brand-name">{{ business_name }}</span>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 10.5 10 4l7 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9.5V16a.5.5 0 0 0 .5.5H8a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v3a.5.5 0 0 0 .5.5h2.5a.5.5 0 0 0 .5-.5V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Dashboard
            </a>
            <a href="{{ url_for('projects_list') }}" class="nav-link {% if request.endpoint in ['projects_list', 'project_details', 'edit_project'] %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M2.5 6.2c0-.9.7-1.6 1.6-1.6h3l1.4 1.8h7.4c.9 0 1.6.7 1.6 1.6v6.4c0 .9-.7 1.6-1.6 1.6H4.1c-.9 0-1.6-.7-1.6-1.6V6.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                Projects
            </a>
            <a href="{{ url_for('add_project') }}" class="nav-link {% if request.endpoint == 'add_project' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                Add Project
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}" class="nav-link nav-link-muted">
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M8 4H4.6C4 4 3.5 4.5 3.5 5.1v9.8c0 .6.5 1.1 1.1 1.1H8M13 13.5 16.5 10 13 6.5M7.5 10H16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Logout
            </a>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        {% include "_flash.html" %}
        {% block content %}{% endblock %}
    </main>
</div>
{% else %}
    {% include "_flash.html" %}
    {% block auth_content %}{% endblock %}
{% endif %}

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
