{% extends "base.html" %}
{% block title %}Edit Project{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Edit project</h1>
        <p class="page-subtitle">{{ project.get('client_name', '') }} &mdash; {{ project.get('project_name', '') }}</p>
    </div>
</div>

<section class="panel panel-form">
    <form method="POST" action="{{ url_for('edit_project', project_id=project.id) }}" novalidate>
        <div class="form-grid">
            <div class="field">
                <label class="field-label" for="client_name">Client name</label>
                <input class="field-input" type="text" id="client_name" name="client_name" value="{{ project.get('client_name', '') }}" required>
            </div>
            <div class="field">
                <label class="field-label" for="project_name">Project name</label>
                <input class="field-input" type="text" id="project_name" name="project_name" value="{{ project.get('project_name', '') }}" required>
            </div>

            <div class="field">
                <label class="field-label" for="project_amount">Project amount (&#8377;)</label>
                <input class="field-input" type="number" step="0.01" min="0" id="project_amount" name="project_amount" value="{{ project.get('project_amount', 0) }}" required>
            </div>
            <div class="field">
                <label class="field-label" for="paid_amount">Paid amount so far (&#8377;)</label>
                <input class="field-input" type="number" step="0.01" min="0" id="paid_amount" name="paid_amount" value="{{ project.get('paid_amount', 0) }}" required>
            </div>

            <div class="field">
                <label class="field-label" for="project_status">Project status</label>
                <select class="field-select" id="project_status" name="project_status" required>
                    {% for status in statuses %}
                    <option value="{{ status }}" {% if project.get('project_status') == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label class="field-label" for="paid_via">Paid via</label>
                <select class="field-select" id="paid_via" name="paid_via" required>
                    {% for method in payment_methods %}
                    <option value="{{ method }}" {% if project.get('paid_via') == method %}selected{% endif %}>{{ method }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field field-checkbox">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_completed" {% if project.get('is_completed') %}checked{% endif %}>
                    <span>Project completed</span>
                </label>
                <p class="field-hint">You can only generate an invoice once this is checked.</p>
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('project_details', project_id=project.id) }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</section>
{% endblock %}
